apiVersion: apps/v1
kind: Deployment
metadata:
  name: relavoi-webhook
  namespace: relavoi
  labels:
    app: relavoi-webhook
    component: webhook
spec:
  # Critical path: 3 replicas baseline for redundancy and headroom.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: relavoi-webhook
      component: webhook
  template:
    metadata:
      labels:
        app: relavoi-webhook
        component: webhook
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: webhook
          image: relavoi-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SERVICE_MODE
              value: "webhook"
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: relavoi-config
            - secretRef:
                name: relavoi-secrets
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
