apiVersion: apps/v1
kind: Deployment
metadata:
  name: relavoi-worker
  namespace: relavoi
  labels:
    app: relavoi-worker
    component: worker
spec:
  # Worker runs background ticks (session expiry, metrics, CPaaS health).
  # Single replica avoids duplicate work; in a multi-replica setup use leader election.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relavoi-worker
      component: worker
  template:
    metadata:
      labels:
        app: relavoi-worker
        component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: relavoi-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SERVICE_MODE
              value: "worker"
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: relavoi-config
            - secretRef:
                name: relavoi-secrets
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
