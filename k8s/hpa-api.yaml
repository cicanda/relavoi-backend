apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: relavoi-api-hpa
  namespace: relavoi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: relavoi-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
