apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relavoi-api-ingress
  namespace: relavoi
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.relavoi.com
      secretName: relavoi-api-tls
  rules:
    - host: api.relavoi.com
      http:
        paths:
          - path: /v1/webhooks
            pathType: Prefix
            backend:
              service:
                name: relavoi-webhook
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relavoi-api
                port:
                  number: 80
