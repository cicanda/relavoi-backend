# PLACEHOLDER — real values must be injected from Vault / AWS Secrets Manager
# at deploy time. Do NOT commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: relavoi-secrets
  namespace: relavoi
type: Opaque
stringData:
  JWT_SECRET: "<set-in-deployment>"
  ENCRYPTION_MASTER_KEY: "<set-in-deployment>"
  DATABASE_URL: "<set-in-deployment>"
  REDIS_URL: "<set-in-deployment>"
  AT_API_KEY: "<set-in-deployment>"
  TWILIO_ACCOUNT_SID: "<set-in-deployment>"
  TWILIO_AUTH_TOKEN: "<set-in-deployment>"
  FIREBASE_PROJECT_ID: "<set-in-deployment>"
  FIREBASE_CLIENT_EMAIL: "<set-in-deployment>"
  FIREBASE_PRIVATE_KEY: "<set-in-deployment>"
